name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Backend: FastAPI + Pytest (224 unit/integration tests)
  # -------------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: keylo_test
          POSTGRES_USER: keylo_test
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keylo_test -d keylo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend test suite (224 tests)
        working-directory: ./backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+psycopg2://keylo_test:test-password@localhost:5432/keylo_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          GROQ_API_KEY: dummy-groq-key-for-ci
        run: |
          python -m pytest tests -q --tb=short

  # -------------------------------------------------------------------------
  # Frontend: TypeScript check + Vite production build
  # -------------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript type check and Vite production build
        working-directory: ./frontend
        run: npm run build

  # -------------------------------------------------------------------------
  # Docker: validate Compose file and build service images (incl. seed)
  # -------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build backend, frontend, and seed service images
        run: docker compose --profile seed build
